<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadership Application - Student Organization</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">Student Org</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="survey.html">Survey</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="application.html" class="active">Apply for Leadership</a></li>
                <li><a href="admin.html" class="admin-link">Admin</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1>Apply for Leadership</h1>
            <p>Ready to level up to VITAL Senior or Senior?</p>
        </div>
    </section>

    <section class="content">
        <div class="container">
            <div class="form-container">
                <form id="leadershipForm" class="form">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="duration">How long have you been a member? *</label>
                        <select id="duration" name="duration" required>
                            <option value="">Select duration</option>
                            <option value="6-12">6-12 months</option>
                            <option value="1-2">1-2 years</option>
                            <option value="2+">2+ years</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="contributions">Describe your contributions to the team *</label>
                        <textarea id="contributions" name="contributions" rows="5" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="whyLeadership">Why do you want to become a VITAL Senior/Senior? *</label>
                        <textarea id="whyLeadership" name="whyLeadership" rows="5" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="leadershipStyle">Describe your leadership style *</label>
                        <textarea id="leadershipStyle" name="leadershipStyle" rows="5" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="role">Leadership role you're applying for *</label>
                        <select id="role" name="role" required>
                            <option value="">Select role</option>
                            <option value="vital-senior">VITAL Senior</option>
                            <option value="senior">Senior</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit Application</button>
                </form>
                <div id="applicationMessage" class="message"></div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Student Organization. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
